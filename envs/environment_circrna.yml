# circRNA detection, quantification and reconstruction.
# Covers bash stages 13-15.
#
# Versions are UNPINNED so the solver takes the current release; the trailing
# comments record what the manuscript Methods state. Capture what resolved:
#     conda env export --no-builds -n env_circrna > envs/environment_circrna.lock.yml
#
# THREE TOOLS ARE NOT CONDA PACKAGES AND MUST BE INSTALLED BY HAND
# ----------------------------------------------------------------
# 1. CLEAR (run3.py, circ_quant.py) has no bioconda package. Install it from
#    source INTO this environment, after creating it:
#        conda activate env_circrna
#        git clone https://github.com/YangLab/CLEAR
#        cd CLEAR && python ./setup.py install
#    Its requirements - CIRCexplorer2 >=2.3.6, HISAT2 >=2.0.5, StringTie >1.3.6,
#    pysam >=0.8.4, pybedtools - are all listed below, so the build finds them.
#    Pass the checkout to stage 13 with --clear-src.
#
# 2. CIRI2 (CIRI2.pl) and 3. CIRI-AS (CIRI_AS_v1.2.pl) are standalone Perl
#    scripts. The Methods record CIRI2 2.0.6 and CIRI-AS 1.2; those numbers come
#    only from the original path string /media/storage2/jpablo/CIRI2/CIRI_v2.0.6/.
#    Supply them with --ciri2-path and --ciri-as-path on stage 15, or vendor them
#    under tools/ and record their checksums.
#
# CLEAR IS CIRCexplorer3
# ----------------------
# They are one tool: the YangLab repository is titled "CLEAR/CIRCexplorer3".
# There is no separate CIRCexplorer3 binary. CLEAR declares CIRCexplorer2
# >=2.3.6 as a dependency and invokes its `parse` and `annotate` subcommands,
# then adds circ_quant for FPBcirc / FPBlinear / CIRCscore. So circexplorer2
# below is a CLEAR requirement, not an alternative to it, and the Methods are
# right to say CIRCexplorer3.
#
# CLEAR publishes no version number, so the Methods' "v1.0.0" is invented.
# Cite Ma et al. 2019 (doi:10.1101/668657) and the installed commit instead.
name: env_circrna
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.15.0rc3
  - bioconda::hisat2=2.2.3
  - bioconda::star=2.7.11b
  - bioconda::bwa=0.7.19
  - bioconda::samtools=1.24
  - bioconda::fastp=1.4.0
  - bioconda::circexplorer2=2.3.8
  - bioconda::stringtie=3.0.3
  - bioconda::pysam=0.24.1
  - bioconda::pybedtools=0.12.1
  - bioconda::ciriquant=1.1.3
  - bioconda::ciri2=2.0.6
  - bioconda::ciri-as=1.2
  - conda-forge::perl=5.44.0
  - bioconda::perl-bioperl=1.7.8
  - bioconda::bedtools=2.31.1
  - bioconda::ucsc-gtftogenepred=482
  - conda-forge::gawk=5.4.1
  - bioconda::coreutils=8.25


