# QC, trimming, alignment, assembly, annotation, quantification.
# Covers bash stages 01-10 and the transcript-metadata chain 09b-09e.
#
# Versions are deliberately UNPINNED so the solver takes the current release.
# The trailing comment on each line is the version the manuscript Methods
# record, for comparison after the environment is built. Capture what actually
# resolved with:
#     conda env export --no-builds -n env_qc_align > envs/environment_qc_align.lock.yml
# and update metadata/software_tool_inventory.tsv from that export.
#
# gawk is REQUIRED, not optional: the metadata chain uses GNU awk's
# three-argument match(), which mawk and BSD awk do not implement. Without
# gawk, stage 09e produces silently wrong output, so the stage aborts if the
# binary it finds is not GNU awk.
name: env_qc_align
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.15.0rc3
  - bioconda::fastqc=0.13.0
  - bioconda::fastp=1.4.0
  - bioconda::multiqc=1.35
  - bioconda::hisat2=2.2.3
  - bioconda::samtools=1.24
  - bioconda::stringtie=3.0.3
  - bioconda::gffcompare=0.12.10
  - bioconda::gffread=0.12.9
  - bioconda::feelnc=0.2
  - bioconda::salmon=2.8.0
  - conda-forge::gawk=5.4.1
  - conda-forge::grep=3.12
  - conda-forge::sed=4.10
  - conda-forge::coreutils=9.12
  - conda-forge::pigz=2.8
  - conda-forge::curl=8.23.0
  - conda-forge::wget=1.25.0
