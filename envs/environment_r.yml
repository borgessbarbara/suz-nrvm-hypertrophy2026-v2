# R environment for the 27 analysis stages under scripts/R/.
#
# Versions are UNPINNED so the solver takes the current release. conda-forge
# currently has r-base 4.6.1, which matches the R this repository was developed
# against. Capture what resolved with:
#     conda env export --no-builds -n env_r > envs/environment_r.lock.yml
# and record sessionInfo() from the machine that produces the deposited figures.
#
# The package list is the union of what the 27 stages load. Packages that only
# the archived, superseded scripts used (ggalluvial, ggcharts, plotrix, wrMisc,
# Rmisc, calibrate, gplots, reshape, viridis, ggplotify, devtools) are
# deliberately not installed.
#
# optparse backs the --help CLI every stage exposes; R.utils reads the gzipped
# tables under data/frozen/.
#
# This environment is not activated by _activate_env.sh - the R stages are run
# through scripts/bash/_run_r_analysis.sh, or directly with Rscript. Activate
# it yourself first:
#     conda activate env_r && bash scripts/bash/_run_r_analysis.sh
name: env_r
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base                # conda-forge current: 4.6.1
  # --- CLI and IO ----------------------------------------------------------
  - r-optparse
  - r-r.utils
  - r-readr
  - r-readxl
  - r-data.table
  # --- tidyverse core ------------------------------------------------------
  - r-tidyverse
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-tibble
  - r-purrr
  - r-forcats
  - r-magrittr
  - r-rlang
  # --- plotting ------------------------------------------------------------
  - r-ggplot2
  - r-ggrepel
  - r-scales
  - r-rcolorbrewer
  - r-viridislite
  - r-pheatmap
  - r-cowplot
  - r-gridextra
  - r-patchwork
  - r-ggnewscale
  - r-upsetr
  - r-ggvenn
  - r-circlize
  - r-cairo               # save_figure() prefers cairo_pdf, with a fallback
  - r-mass
  - r-hmisc
  - r-reshape2
  # --- Bioconductor --------------------------------------------------------
  - bioconductor-deseq2
  - bioconductor-apeglm
  - bioconductor-tximport
  - bioconductor-biomart
  - bioconductor-rtracklayer
  - bioconductor-genomicranges
  - bioconductor-biostrings
  - bioconductor-biobase
  - bioconductor-annotationdbi
  - bioconductor-org.rn.eg.db
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-dose
  - bioconductor-complexheatmap
  - bioconductor-enhancedvolcano
  - bioconductor-mfuzz
  - bioconductor-genefilter
  - bioconductor-vsn
  # sva/ComBat_seq is used ONLY by the historical circRNA notebooks under
  # archive/, and by R04b --use-combat. Whether it belongs in the final circRNA
  # DE branch is unresolved (docs/OPEN_ISSUES.md section 7.2); it is installed
  # so that route can be reproduced for comparison.
  - bioconductor-sva
